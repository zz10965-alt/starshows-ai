<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星演 StarShow · AI 观演规划 Agent</title>
<style>
  :root {
    --pink: #ff6b9d;
    --violet: #a06bff;
    --yellow: #ffc94d;
    --mint: #3fd0a8;
    --sky: #5cb8ff;
    --coral: #ff8a5c;
    --ink: #3a2e45;
    --ink-soft: #7a6f8a;
    --bg1: #fff4f6;
    --bg2: #fff8e8;
    --bg3: #eef4ff;
    --card: #ffffff;
    --line: #f0e6ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    overflow: hidden;
    position: relative;
  }
  .stickers { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .sticker { position: absolute; font-size: 24px; opacity: .20; animation: floaty 8s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-16px) rotate(6deg); } }

  .app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }

  header { padding: 14px 22px 10px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logo {
    width: 46px; height: 46px; border-radius: 15px;
    background: linear-gradient(135deg, var(--pink), var(--violet));
    display: flex; align-items: center; justify-content: center; font-size: 24px;
    box-shadow: 0 6px 18px rgba(255,107,157,.35);
  }
  .brand { line-height: 1.2; }
  .brand .t { font-size: 18px; font-weight: 800; letter-spacing: .5px; }
  .brand .t .hl { background: linear-gradient(90deg, var(--pink), var(--violet)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .brand .s { font-size: 12px; color: var(--ink-soft); }
  .demo-badge { font-size: 11px; color: var(--violet); background: #f3edff; padding: 5px 11px; border-radius: 999px; font-weight: 600; }

  .tabs { display: flex; gap: 6px; margin-left: auto; background: rgba(255,255,255,.7); padding: 6px; border-radius: 999px; box-shadow: 0 4px 16px rgba(160,107,255,.10); }
  .tab {
    display: flex; align-items: center; gap: 6px; padding: 8px 15px; border-radius: 999px;
    font-size: 14px; color: var(--ink-soft); cursor: pointer; transition: all .2s; white-space: nowrap;
  }
  .tab.active { background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; font-weight: 700; box-shadow: 0 4px 14px rgba(255,107,157,.4); }

  #view { flex: 1; min-height: 0; padding: 0 22px 20px; display: flex; }
  .cols { flex: 1; min-height: 0; display: grid; gap: 16px; }
  .home-cols { grid-template-columns: 250px 1fr 340px; }
  .chat-cols { grid-template-columns: 250px 1fr; }

  .card { background: var(--card); border-radius: 20px; box-shadow: 0 8px 30px rgba(122,95,160,.10); overflow: hidden; display: flex; flex-direction: column; }

  /* 左栏：画像卡 */
  .profile, .chat-side, .trip-panel, .rec-panel { padding: 18px 16px; overflow-y: auto; }
  .pf-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .avatar {
    width: 50px; height: 50px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, var(--yellow), var(--coral));
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,201,77,.45); } 50% { box-shadow: 0 0 0 9px rgba(255,201,77,0); } }
  .pf-head .t { font-weight: 800; font-size: 15px; }
  .pf-head .s { font-size: 11px; color: var(--ink-soft); }
  .pf-edit { margin-left: auto; font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--violet); color: var(--violet); background: #fff; cursor: pointer; font-weight: 700; }
  .pf-progress { height: 6px; background: #f2e9f4; border-radius: 6px; margin: 12px 0 14px; overflow: hidden; }
  .pf-progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--mint), var(--sky)); border-radius: 6px; transition: width .5s ease; }
  .pf-tags { display: flex; flex-direction: column; gap: 10px; }
  .pf-tag {
    display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-radius: 14px;
    background: #faf4fb; border: 1.5px dashed #eadcee; color: var(--ink-soft); font-size: 13px;
    transition: all .3s;
  }
  .pf-tag .em { font-size: 18px; }
  .pf-tag .lab { color: var(--ink-soft); }
  .pf-tag .val { font-weight: 700; color: var(--ink); }
  .pf-tag.filled { border-style: solid; border-color: transparent; background: linear-gradient(135deg, #fff0f5, #f0edff); color: var(--ink); animation: pop .4s ease; }
  .pf-tag.filled .val { color: var(--pink); }
  @keyframes pop { 0% { transform: scale(.9); opacity: .3; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
  .pf-foot { margin-top: 14px; font-size: 11px; color: var(--ink-soft); line-height: 1.6; }

  .rec-head, .trip-head { font-weight: 800; font-size: 15px; margin-bottom: 12px; }

  .concert-card { padding: 15px; border-radius: 16px; border: 1.5px solid var(--line); margin-bottom: 12px; cursor: pointer; transition: all .18s; background: #fff; }
  .concert-card:hover { border-color: var(--violet); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(160,107,255,.18); }
  .concert-card .row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .concert-card .art { font-size: 16px; font-weight: 800; }
  .concert-card .tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #fff0f5; color: var(--pink); font-weight: 700; }
  .concert-card .meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; line-height: 1.6; }
  .concert-card .go { margin-top: 10px; font-size: 12.5px; font-weight: 700; color: var(--violet); }

  .trip-card { padding: 13px 14px; border-radius: 14px; border: 1.5px solid var(--line); margin-bottom: 10px; cursor: pointer; transition: all .18s; background: #fff; }
  .trip-card:hover { border-color: var(--pink); }
  .trip-card .t1 { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; flex-wrap: wrap; }
  .trip-card .t2 { font-size: 12px; color: var(--ink-soft); margin-top: 5px; line-height: 1.6; }
  .trip-days { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: #fff0f5; color: var(--pink); font-weight: 700; }
  .trip-x { flex: none; margin-left: auto; width: 24px; height: 24px; border-radius: 50%; border: none; background: #f3ecf7; color: var(--ink-soft); font-size: 13px; cursor: pointer; line-height: 1; }
  .trip-x:hover { background: #ffe2e2; color: #d33; }
  .plan-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .plan-bar .bar { flex: 1; height: 7px; border-radius: 7px; background: #eee4f1; overflow: hidden; }
  .plan-bar .bar i { display: block; height: 100%; border-radius: 7px; background: linear-gradient(90deg, var(--mint), var(--sky)); }
  .plan-bar span { font-size: 11px; color: var(--ink-soft); font-weight: 700; }
  .plan-next { font-size: 11.5px; color: var(--violet); margin-top: 6px; font-weight: 700; }

  /* 状态 pill */
  .spill { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #f3edff; color: var(--violet); cursor: pointer; transition: all .15s; white-space: nowrap; }
  .spill.on { background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; }
  .spill.mini { font-size: 11px; padding: 2px 9px; cursor: default; }
  .spill.big { font-size: 13px; padding: 8px 16px; }
  .status-pills { display: flex; gap: 7px; flex-wrap: wrap; }
  .status-pills.big { gap: 10px; }

  /* 问卷 */
  .quest { max-width: 780px; margin: 0 auto; width: 100%; padding: 28px 30px; background: var(--card); border-radius: 20px; box-shadow: 0 8px 30px rgba(122,95,160,.10); overflow-y: auto; }
  .quest h2 { font-size: 20px; margin-bottom: 4px; }
  .quest .sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 20px; }
  .q-step { margin-bottom: 20px; }
  .q-lab { font-size: 14px; font-weight: 800; margin-bottom: 10px; }
  .q-lab small { color: var(--ink-soft); font-weight: 600; font-size: 11px; margin-left: 4px; }
  .opt-grid { display: flex; flex-wrap: wrap; gap: 9px; }
  .opt-card { padding: 10px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: #faf6fc; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink-soft); transition: all .18s; }
  .opt-card:hover { border-color: var(--violet); }
  .opt-card.on { background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(255,107,157,.35); }
  .quest .foot { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
  .quest .prog { flex: 1; height: 8px; background: #f2e9f4; border-radius: 8px; overflow: hidden; }
  .quest .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--mint), var(--sky)); border-radius: 8px; transition: width .4s ease; }
  .quest .btn-big { width: auto; padding: 11px 28px; }

  /* 详情页 */
  .detail-top { display: flex; align-items: flex-start; gap: 12px; padding: 0 2px 16px; }
  .detail-top .dt-main { flex: 1; min-width: 0; }
  .detail-top .dt-title { font-size: 16px; font-weight: 800; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail-top .dt-emoji { font-size: 18px; }
  .detail-top .dt-tour { font-size: 13px; font-weight: 700; color: var(--violet); }
  .detail-top .dt-meta { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .back { padding: 7px 13px; border-radius: 999px; border: 1.5px solid var(--violet); color: var(--violet); background: #fff; font-weight: 700; cursor: pointer; font-size: 12.5px; flex: none; }
  .watch-btn { padding: 8px 15px; border-radius: 999px; border: none; background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; font-weight: 700; cursor: pointer; font-size: 12.5px; flex: none; box-shadow: 0 4px 14px rgba(255,107,157,.35); }
  .watch-btn:hover { box-shadow: 0 8px 20px rgba(255,107,157,.45); }

  .seat-panel, .host-panel { overflow-y: auto; }
  .panel-head { padding: 15px 18px 12px; font-weight: 800; font-size: 15px; border-bottom: 1px solid var(--line); }
  .seat-body, .host-body { padding: 16px; }

  .pref-switch { display: flex; gap: 8px; margin-bottom: 14px; }
  .pref-btn { flex: 1; padding: 9px 4px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); transition: all .18s; }
  .pref-btn.on { background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(255,107,157,.35); }

  .rec-card { padding: 15px; border-radius: 16px; background: linear-gradient(135deg, #fff0f5, #f0edff); border: 1.5px solid #f4d9ec; margin-bottom: 14px; animation: up .4s ease; }
  .rec-card.alt { background: #faf6fc; border-color: var(--line); }
  .rec-card .lbl { font-size: 11px; font-weight: 800; color: var(--violet); letter-spacing: .5px; }
  .rec-card .name { font-size: 17px; font-weight: 800; margin: 4px 0 2px; }
  .rec-card .price { font-size: 20px; font-weight: 800; color: var(--pink); }
  .rec-card .reason { font-size: 13px; color: var(--ink); line-height: 1.6; margin-top: 8px; }
  .rec-card .upg { font-size: 12px; color: var(--coral); margin-top: 8px; line-height: 1.5; }

  .tier-row { padding: 11px 12px; border-radius: 13px; margin-bottom: 8px; background: #faf6fc; border: 1.5px solid transparent; cursor: pointer; transition: all .18s; }
  .tier-row.rec { border-color: var(--pink); background: #fff5f9; }
  .tier-row.preview { border-color: var(--violet); background: #f6f1ff; }
  .tier-row .t1 { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }
  .tier-row .tname { font-weight: 700; font-size: 13.5px; }
  .tier-row .tprice { margin-left: auto; font-weight: 800; color: var(--pink); font-size: 13.5px; }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--pink); color: #fff; font-weight: 800; }
  .bar-line { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; }
  .bar-line .bl { width: 34px; flex: none; }
  .bar-line .bar { flex: 1; height: 7px; border-radius: 7px; background: #eee4f1; overflow: hidden; }
  .bar-line .bar i { display: block; height: 100%; border-radius: 7px; }
  .bar-line .bv { width: 20px; flex: none; text-align: right; color: var(--ink); font-weight: 700; }
  .view-caption { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; margin: 10px 2px 4px; padding: 9px 12px; border-radius: 11px; background: #faf6fc; }

  .checklist { display: flex; flex-direction: column; gap: 9px; }
  .check { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border-radius: 13px; background: #faf6fc; cursor: pointer; transition: all .18s; }
  .check:hover { background: #f3ecf7; }
  .check input { margin-top: 2px; width: 17px; height: 17px; accent-color: var(--mint); cursor: pointer; }
  .check .ct { font-size: 13.5px; line-height: 1.5; }
  .check .ct small { display: block; color: var(--ink-soft); font-size: 11.5px; margin-top: 1px; }
  .check.done { background: #effaf6; }
  .check.done .ct { color: var(--ink-soft); text-decoration: line-through; }

  .sec-item { display: flex; gap: 10px; padding: 9px 12px; border-radius: 12px; background: #faf6fc; margin-bottom: 7px; font-size: 12.5px; line-height: 1.5; }
  .sec-item.ok { background: #effaf6; }
  .sec-item.no { background: #fff0f0; }
  .sec-item .em { font-size: 15px; flex: none; }

  .hotel-card { padding: 12px 13px; border-radius: 13px; border: 1.5px solid var(--line); margin-bottom: 9px; }
  .hotel-card .n { font-weight: 700; font-size: 13.5px; }
  .hotel-card .d { font-size: 12px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }

  .host-sec { border-bottom: 1px solid var(--line); }
  .host-sec:last-child { border-bottom: none; }
  .sec-head { display: flex; align-items: center; gap: 8px; padding: 13px 4px; font-size: 13.5px; font-weight: 800; color: var(--ink); cursor: pointer; user-select: none; }
  .sec-head:hover { color: var(--violet); }
  .sec-caret { color: var(--violet); font-size: 13px; width: 12px; flex: none; }
  .sec-body { padding: 2px 4px 14px; }
  .transport-card { padding: 12px 13px; border-radius: 13px; border: 1.5px solid var(--line); margin-bottom: 9px; }
  .transport-card .n { font-weight: 700; font-size: 13.5px; }
  .transport-card .d { font-size: 12px; color: var(--pink); font-weight: 700; }
  .transport-card .tip { font-size: 12px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }

  .copy-card { padding: 14px; border-radius: 15px; background: #faf6fc; margin-bottom: 12px; }
  .copy-card .h { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13.5px; margin-bottom: 8px; }
  .copy-card .txt { font-size: 13px; line-height: 1.65; color: var(--ink); background: #fff; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line); }
  .copy-card .btn-copy { margin-top: 9px; padding: 7px 14px; border: none; border-radius: 10px; background: var(--violet); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; transition: all .15s; }
  .copy-card .btn-copy:hover { background: var(--pink); }

  .lbl { font-size: 11px; font-weight: 800; color: var(--violet); letter-spacing: .5px; margin: 16px 0 10px; }
  .empty-hint { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 30px 10px; line-height: 1.7; }
  .empty-hint .em { font-size: 42px; display: block; margin-bottom: 10px; }

  /* 详情三模式 + 收藏 + 社群 */
  .detail-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .detail-tabs { display: flex; gap: 8px; margin: 0 2px 14px; }
  #detailMain { flex: 1; min-height: 0; overflow-y: auto; }
  .fav-btn { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--yellow); color: #b8860b; background: #fffaf0; font-weight: 700; cursor: pointer; font-size: 12.5px; flex: none; transition: all .18s; }
  .fav-btn:hover { background: var(--yellow); color: #fff; border-color: var(--yellow); }

  .card-actions { display: flex; gap: 8px; margin-top: 10px; }
  .mini-btn { padding: 6px 13px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; color: var(--ink-soft); font-size: 12px; font-weight: 700; cursor: pointer; transition: all .15s; }
  .mini-btn:hover { border-color: var(--violet); color: var(--violet); }
  .mini-btn.primary { background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; border-color: transparent; }
  .mini-btn.primary:hover { color: #fff; }
  .mini-btn.primary.on { background: #fff; color: var(--violet); border: 1.5px solid var(--violet); }
  .mini-btn.on { background: var(--yellow); color: #fff; border-color: var(--yellow); }
  .mini-btn.danger { color: #d33; }
  .mini-btn.danger:hover { background: #ffe2e2; border-color: #f5b5b5; color: #d33; }

  .fav-sec { margin-top: 18px; border-top: 1px solid var(--line); }
  .fav-row { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
  .fav-row:last-child { border-bottom: none; }
  .fav-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }
  .fav-btns { display: flex; gap: 6px; flex: none; }

  .hotel-group { padding: 12px 13px; border-radius: 14px; border: 1.5px solid var(--line); margin-bottom: 10px; background: #fff; }
  .hg-head { display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
  .hg-head .em { font-size: 18px; }
  .hg-head .cnt { margin-left: auto; font-size: 11px; font-weight: 800; color: var(--pink); background: #fff0f5; padding: 2px 9px; border-radius: 999px; }
  .hg-sub { font-size: 12px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }
  .hg-items { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; margin-bottom: 9px; }
  .hg-item { font-size: 12px; color: var(--ink); padding: 6px 9px; border-radius: 9px; background: #faf6fc; }

  .community { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .com-head { display: flex; align-items: center; gap: 10px; }
  .com-head > span { font-size: 30px; }
  .com-head b { font-size: 14px; }
  .com-head .s { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .shard { font-size: 12px; color: var(--violet); background: #f3edff; padding: 9px 13px; border-radius: 11px; line-height: 1.5; }
  .chans { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; }
  .chan-chip { flex: none; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; color: var(--ink-soft); font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all .15s; }
  .chan-chip.on { background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; border-color: transparent; }
  .cmsgs { min-height: 220px; max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 2px; }
  .cmsg { display: flex; gap: 9px; }
  .cava { width: 34px; height: 34px; border-radius: 50%; flex: none; background: #f6f0fb; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .cmain { min-width: 0; }
  .cmeta { display: flex; align-items: center; gap: 7px; font-size: 11px; flex-wrap: wrap; }
  .cmeta b { font-size: 12.5px; color: var(--ink); }
  .cmeta span { color: var(--ink-soft); }
  .cmeta .ct { margin-left: auto; color: #b9aec4; }
  .cbubble { margin-top: 4px; padding: 9px 13px; border-radius: 14px; background: #faf6fc; border: 1px solid var(--line); font-size: 13px; line-height: 1.55; border-top-left-radius: 4px; }
  .warn { font-size: 11.5px; color: #b8860b; background: #fff8e1; padding: 9px 13px; border-radius: 11px; line-height: 1.5; }
  .cinput { display: flex; gap: 8px; }
  .cinput input { flex: 1; min-width: 0; padding: 11px 15px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 13.5px; outline: none; background: #fff; color: var(--ink); }
  .cinput input:focus { border-color: var(--violet); }
  .cinput button { width: 44px; height: 44px; flex: none; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; font-size: 17px; cursor: pointer; transition: all .18s; }
  .cinput button:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(255,107,157,.4); }

  /* 聊天 */
  .chat { background: rgba(255,255,255,.72); backdrop-filter: blur(6px); }

const LS_KEY = 'starshows_v2';
function saveState(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({ profile, watchlist, favorites, community })); } catch(e){}
}
function migrateProfile(p){
  if(!p) return p;
  if(typeof p.artist==='string'){ p.artists=[p.artist]; delete p.artist; }
  if(typeof p.city==='string'){ p.cities=[p.city]; delete p.city; }
  if(p.artists && !Array.isArray(p.artists)) p.artists=[p.artists];
  if(p.cities && !Array.isArray(p.cities)) p.cities=[p.cities];
  return p;
}
function migrateWatchlist(list){
  list.forEach(w=>{
    if(typeof w.status==='string' && !STATUS_IDS.includes(w.status)){
      if(w.status==='已有票') w.status='ticketed';
      else if(w.status==='还在考虑') w.status='considering';
      else w.status='ticketing';
    }
    if(!w.status) w.status='ticketing';
    // 旧版 plan 结构迁移：老数据无 returnJourney、任务无 stage，会导致阶段内容为空
    if(w.plan && !Array.isArray(w.plan.returnJourney)){
      const c = CONCERTS.find(c=>c.id===w.id);
      if(c){
        const old = w.plan;
        const fresh = buildPlan(c, w);
        if(Array.isArray(old.tasks)){
          const doneByKey = {};
          old.tasks.forEach(t=>{ doneByKey[t.key] = !!t.done; });
          fresh.tasks.forEach(t=>{ if(doneByKey[t.key] != null) t.done = doneByKey[t.key]; });
        }
        w.plan = fresh;
      }
    }
  });
  return list;
}
function loadState(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(d.profile) profile = migrateProfile(d.profile);
    if(profile) state.prefLabel = profile.pref;
    if(d.watchlist) watchlist = migrateWatchlist(d.watchlist);
    if(d.favorites) favorites = d.favorites;
    if(d.community) community = d.community;
    saveState();
    return true;
  } catch(e){ return false; }
}

function daysUntil(dateStr){
  const m = dateStr.match(/(\d{4})\.(\d{2})\.(\d{2})/);
  if(!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  const now = new Date();
  return Math.ceil((d - now)/86400000);
}
function isWeekend(dateStr){ return /(周六|周日)/.test(dateStr); }
function daysLabel(d){
  if(d===null) return '';

  if(d===0) return '就是今天 🎉';
  return d+' 天后';
}

  if(d===null) return '';
  if(d<0) return '已结束';
  if(d===0) return 'D-Day';
  return 'D-'+d;
}

function switchView(v){
  if(v==='detail' && !state.activeConcert){
    state.activeConcert = CONCERTS.find(c=>profArtists().includes(c.artist)) || CONCERTS[0];
  }
  if(v==='plan' && !state.activeConcert){
    const ap=activePlan();
    if(ap) state.activeConcert = ap.c;
  }
  if((v==='detail'||v==='plan') && state.view!==v){
    state.from = state.view;
    if(v==='detail' && !state.detailTabLocked) state.detailTab='seat';
    if(v==='plan' && !state.planStageLocked){ state.planStage='prep'; state.planNode=null; state.journeySel=null; }
  }
  state.detailTabLocked = false;
  state.planStageLocked = false;
  state.view=v;
  renderTabs();
  renderMain();
}

  state.hostFocus = focus || null;
  state.detailTabLocked = true;

}
/* 导航：跳到计划页某个阶段 +（可选）聚焦的节点 */
function openPlanStage(stage, node){

/* ================= 画像 ================= */
function fieldFilled(f){ const v = profile && profile[f.key]; if(!v) return false; return Array.isArray(v) ? v.length>0 : true; }
function fieldDisplay(f){ const v = profile && profile[f.key]; if(v==null) return null; return Array.isArray(v) ? v.join(' · ') : v; }
function profileDone(){ return profile && PROFILE_FIELDS.every(f=>fieldFilled(f)); }
function profileCount(){ return profile ? PROFILE_FIELDS.filter(f=>fieldFilled(f)).length : 0; }

  PROFILE_FIELDS.forEach(f=>{

    f.opts.forEach(o=>{

function rank(c){
  const a = profArtists().includes(c.artist) ? 3 : 0;
  const hom = (profile && c.city===profile.home) ? 2 : 0;
  const cit = profCities().includes(c.city) ? 1 : 0;
  return a+hom+cit;
}
function timeTag(c){
  if(profile.time==='周末场' && isWeekend(c.date)) return ' · <b style="color:var(--mint)">周末场 ✓</b>';
  if(profile.time==='工作日晚上' && !isWeekend(c.date)) return ' · <b style="color:var(--mint)">平日晚上 ✓</b>';
  return '';
}

/* ================= 推荐 / 选座打分 ================= */
function score(t, key){
  if(key==='close') return t.close*0.7 + t.view*0.2 + t.sound*0.1;
  if(key==='sound') return t.sound*0.6 + t.view*0.25 + t.close*0.15;
  return (t.view*0.35 + t.sound*0.35 + t.close*0.3) / (t.price/100);
}
function recommend(c){
  c = c || state.activeConcert || CONCERTS[0];
  const key=PREFS[state.prefLabel] || PREFS[(profile && profile.pref)] || 'value';
  const max=BUDGETS[profile ? profile.budget : '不限'];
  const tiers=c.tiers.map(tierObj);
  const within=tiers.filter(t=>t.price<=max);
  const pool=within.length?within:tiers;
  const scored=pool.map(t=>({t, s:score(t,key)})).sort((a,b)=>b.s-a.s);
  const best=scored[0].t;
  let upg=null;
  if(within.length && within.length<tiers.length){
    const above=tiers.filter(t=>t.price>max).sort((a,b)=>a.price-b.price)[0];
    if(above) upg=above;
  }
  let alt=null;
  if(scored.length>1) alt=scored[1].t;
  else if(upg) alt=upg;
  else alt=scored[0].t;
  const reason = buildReason(best, key);
  const upgrade = upg ? `想要更好一点？从「${best.name}」（¥${best.price}）加 <b>¥${upg.price - best.price}</b> 可上「${upg.name}」（¥${upg.price}）——${upg.tip}。` : '';
  return { tiers, best, alt, reason, upgrade, key };
}
function buildReason(t, key){
  const b=profile ? profile.budget : '不限';
  if(key==='close') return `在 <b>${b}</b> 内，这档离舞台最近（距离 <b>${t.close}/10</b>、视野 <b>${t.view}/10</b>）。${t.tip}。`;
  if(key==='sound') return `这档声场最均衡（音响 <b>${t.sound}/10</b>、视野 <b>${t.view}/10</b>），听得最舒服。${t.tip}。`;
  return `综合「视野 ${t.view} · 音响 ${t.sound} · 距离 ${t.close}」除以票价，性价比最高的一档。${t.tip}。`;
}

/* ================= 待看 / 收藏 / 计划 ================= */
function inWatchlist(id){ return watchlist.some(w=>w.id===id); }
function getWatch(id){ return watchlist.find(w=>w.id===id); }
function isFav(id){ return favorites.includes(id); }
function toggleFavorite(c){
  if(favorites.includes(c.id)) favorites = favorites.filter(id=>id!==c.id);
  else favorites.push(c.id);
  saveState();
  if(state.view==='detail') renderDetail();
  else renderMain();
  toast(favorites.includes(c.id) ? `★ 已加入收藏 · ${c.artist}` : '已取消收藏');
}
function ensureWatch(c){
  let w=getWatch(c.id);
  if(!w){ w={ id:c.id, tier:null, status:'ticketing', checklist:[false,false,false,false,false,false], addedAt:Date.now() }; watchlist.push(w); saveState(); }
  return w;
}
function ensurePack(w){
  if(!w.pack) w.pack = PACKING.map(t=>({txt:t, done:false}));
  return w.pack;
}
function addToWatchlist(c){
  openWatchModal(c);
}
function removeFromWatchlist(id){
  watchlist = watchlist.filter(w=>w.id!==id);
  if(community[id]) community[id].joined = false;
  saveState();
  if(state.view==='detail') renderDetail();
  else renderMain();
  toast('已取消待看');
}
function activePlan(){
  const wl = watchlist.filter(w=>w.plan);
  let w = (state.activeConcert && wl.find(w=>w.id===state.activeConcert.id)) || wl[0];
  if(!w) return null;
  const c = CONCERTS.find(c=>c.id===w.id) || CONCERTS[0];
  return { c, w, plan: w.plan };
}
function openPlan(c){
  state.activeConcert=c;
  const w=getWatch(c.id);
  if(w && !w.plan) generatePlan(c, w);
  state.planStage='prep'; state.planNode=null; state.journeySel=null;
  switchView('plan');
  enterPlanRefresh(c);
}
function enterPlanRefresh(c){
  toast('✨ 小星正在看看有没有新变化…');
  setTimeout(()=>{
    const w=c && getWatch(c.id);
    const rain = w && w.plan && w.plan.weather && w.plan.weather.rain>=60;
    toast(rain ? '🌧️ 小星发现一项新变化：演出当天可能有雨' : '✓ 一切按计划进行，没有新变化');
  }, 600);
}
function generatePlan(c, w){
  if(!w.status) w.status='ticketing';
  w.plan = buildPlan(c, w);
  saveState();
}
function setStatus(w, id){
  const prev = w.status;
  if(id==='ticketed' && prev!=='ticketed'){
    w.status='ticketed';
    const t=w.plan && w.plan.tasks.find(t=>t.key==='ticket'); if(t) t.done=true;
    if(w.plan && w.plan.rec) w.tier = w.tier || w.plan.rec.best.name;
    saveState(); rerender();
    toast('🎫 已经有票啦！抢票任务我帮你收起来了，之前安排好的住宿、交通和行程都还在。');
  } else if(id==='ticketing' && prev==='ticketed'){
    confirmReverseStatus(w);
  } else if(id!==prev){
    w.status=id;
    saveState(); rerender();
    toast('状态已更新为「'+statusLabel(id)+'」');
  }
}
function confirmReverseStatus(w){
  const m=el('div','overlay');
  const box=el('div','modal');
  box.innerHTML = `<h3>🔄 切换回「准备抢票」？</h3>
    <div class="msub">切换后会重新显示抢票相关任务，之前的住宿、交通和行程不会被删除。</div>

/* ================= 生成 AI 观演计划 ================= */
function weatherFor(c){ return Object.assign({}, WEATHER_MOCK, { adjustments:[{txt:'Checklist 新增「雨伞」'},{txt:'出发时间提前 15 min'},{txt:'户外拍照时间缩短 20 min'}] }); }
function agentSummary(c, tasks, days){
  const undone = tasks.filter(t=>!t.done);
  if(!undone.length) return `距演出还有 ${days} 天，行前的事都安排好啦，就等演出当天出发去见 ${c.artist}。`;
  const next = undone[0];
  const map = { ticket:'确定抢票策略', hotel:'确定住宿', transport:'确认城际交通', weather:'关注天气', checklist:'做行前检查' };
  return `距演出还有 ${days} 天，接下来先做这件事：「${map[next.key]||next.title}」。我会根据天气、交通和你的计划变化随时更新。`;
}
function buildJourney(c, hotel){
  const fromTitle = hotel ? '从'+hotel.name+'出发' : '从住处出发（住宿待定）';
  const fromSub = hotel ? '步行 4 min 到地铁站' : '选定酒店后自动更新出发路线';
  return [
    { t:'15:40', emoji:'🏨', title:fromTitle, sub:fromSub, poi:'hotel' },
    { t:'15:45', emoji:'🚇', title:'××地铁站', sub:'地铁 18 min', poi:'metro' },
    { t:'16:10', emoji:'🍜', title:'演出前吃饭', sub:'老上海面馆 · 距场馆 400m', poi:'noodle' },
    { t:'17:00', emoji:'📸', title:'场馆打卡 / 领周边', sub:'场馆外应援区', poi:'photo' },
    { t:'17:40', emoji:'🛂', title:'排队安检', sub:'建议轻装，减少排队', poi:'security' },
    { t:'18:30', emoji:'🎫', title:'建议入场', sub:'留出找座 + 缓冲时间', poi:'entry' },
    { t:'19:30', emoji:'🎤', title:'演出开始', sub:c.artist+' · '+c.tour, poi:'stage' },
    { t:'22:10', emoji:'🎉', title:'预计散场', sub:'按演出 2h40min 估算', poi:'end' },
  ];
}
function buildReturnJourney(c, hotel){
  const endTitle = hotel ? '返回'+hotel.name : '返回住处';
  return [
    { t:'22:20', emoji:'🚶', title:'前往返程站点', sub:'最近地铁站拥挤，步行至 XX 站', poi:'walk' },
    { t:'23:10', emoji:'🏨', title:endTitle, sub:'建议提前订好网约车', poi:'hotel' },
  ];
}
function buildPlan(c, w){
  const rec=recommend(c);
  const wx=weatherFor(c);
  const days=daysUntil(c.date);
  const tasks=[];
  const push=(key,emoji,title,when,desc,stage)=>tasks.push({key,emoji,title,when,desc,stage,done:false});
  push('ticket','🎫','确定抢票策略','现在','首选 '+rec.best.name+' · 备选 '+rec.alt.name,'prep');
  push('hotel','🏨','住宿规划','尽快完成','确定场馆附近 / 地铁沿线 / 返程方便的酒店','prep2');
  push('transport','🚄','城际交通确认','尽快完成','根据所在地与演出城市给出交通建议','prep2');
  push('weather','🌦','天气与穿搭','D-3','演出前 3 天自动更新 · '+wx.temp+' '+wx.cond,'prep2');
  push('checklist','🎒','行前检查','D-1','整理随身物品 · 检查门票与证件','prep2');
  return {
    summary: agentSummary(c, tasks, days),
    tasks,
    journey: buildJourney(c, null),
    returnJourney: buildReturnJourney(c, null),
    weather: wx,
    hotel: null,
    noHotel: false,
    transport: null,
    pois: [],
    rec: { best: rec.best, alt: rec.alt },
  };
}

function venueMapSVG(c, curCat){

  s+='<rect width="620" height="300" fill="#fffdf8"/>';
  s+='<circle cx="340" cy="110" r="26" fill="#f3edff" stroke="#a06bff" stroke-width="2"/><text x="340" y="117" text-anchor="middle" font-size="20">🏟</text>';
  s+='<text x="340" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#5a4a6a">'+c.venue+'</text>';
  list.forEach(p=>{
    const x=p.pos[0], y=p.pos[1];
    s+=`<line x1="340" y1="110" x2="${x}" y2="${y}" stroke="#e7dded" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    s+=`<g class="poi-node" data-id="${p.id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="15" fill="#fff" stroke="#d9c9ec" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13">${p.emoji}</text><text x="${x}" y="${y-18}" text-anchor="middle" font-size="9" font-weight="700" fill="#7a6f8a">${p.name}</text></g>`;
  });
  s+='<text x="310" y="292" text-anchor="middle" font-size="10" fill="#b9aec4">Demo · 示意地图（非真实地图）</text>';
  return s+'</svg>';
}
function renderVenueAround(box, c, noHead){
  box.innerHTML='';

  });

    card.appendChild(el('div','poi-why',`✨ 为什么适合你的计划<br>${sel.reason}`));

function isPoiInPlan(id){
  const c=state.activeConcert; if(!c) return false;
  const w=getWatch(c.id);
  return w && w.plan && w.plan.pois && w.plan.pois.includes(id);
}
function insertPoiIntoJourney(plan, poi){
  const j=plan.journey;
  if(poi.cat==='散场夜宵'){
    const r=plan.returnJourney;
    const idx=r.findIndex(s=>s.poi==='walk');
    r.splice(idx+1,0,{t:'22:40',emoji:poi.emoji,title:poi.name,sub:poi.dist+' · '+poi.hours,poi:poi.id});
    r[r.length-1].t='00:10';
  } else if(poi.cat==='交通'||poi.cat==='上车点'){
    const r=plan.returnJourney;
    const idx=r.findIndex(s=>s.poi==='walk');
    r.splice(idx,0,{t:'22:25',emoji:poi.emoji,title:poi.name,sub:poi.dist+' · '+poi.hours,poi:poi.id});
  } else if(poi.cat==='寄存'){
    const idx=j.findIndex(s=>s.poi==='security');
    j.splice(idx,0,{t:'17:35',emoji:poi.emoji,title:poi.name,sub:poi.dist+' · '+poi.hours,poi:poi.id});
  } else if(poi.cat==='吃饭'){
    const idx=j.findIndex(s=>s.poi==='metro');
    j.splice(idx+1,0,{t:'16:10',emoji:poi.emoji,title:poi.name,sub:poi.dist+' · '+poi.hours,poi:poi.id});
  } else {
    const idx=j.findIndex(s=>s.poi==='entry');
    j.splice(idx,0,{t:'17:20',emoji:poi.emoji,title:poi.name,sub:poi.dist+' · '+poi.hours,poi:poi.id});
  }
}
function addPoiToPlan(poi){
  const c=state.activeConcert; if(!c){ toast('先打开一场演出详情'); return; }
  const w=getWatch(c.id);
  if(!w || !w.plan){ toast('先加入待看并生成计划，才能把地点插进行程'); return; }
  if(w.plan.pois && w.plan.pois.includes(poi.id)){ toast('这个地点已经在计划里了'); return; }
  if(!w.plan.pois) w.plan.pois=[];
  w.plan.pois.push(poi.id);
  insertPoiIntoJourney(w.plan, poi);
  saveState();
  toast('📍 已加入计划：'+poi.name);
  closeOverlay();
  if(state.view==='plan') renderPlan(); else renderMain();
}
function removePoiFromPlan(poiId){
  const c=state.activeConcert; if(!c) return;
  const w=getWatch(c.id); if(!w||!w.plan) return;
  w.plan.pois = (w.plan.pois||[]).filter(id=>id!==poiId);
  w.plan.journey = w.plan.journey.filter(s=>s.poi!==poiId);
  w.plan.returnJourney = w.plan.returnJourney.filter(s=>s.poi!==poiId);
  saveState();
  if(state.view==='plan') renderPlan(); else renderMain();
  toast('已从计划移除');
}

      </div>
      <div class="ph-mid">
        <span class="ph-status-label">状态</span>
        <div class="status-pills" id="phPills">${pills}</div>
        <div class="ph-actions">
          <button class="mini-btn" id="phDetail">查看演出详情</button>
          <button class="mini-btn" id="phPoi">🗺 场馆周边</button>
          <button class="mini-btn primary" id="phAgent">✨ 问问小星</button>
        </div>
      </div>
    </div>
    ${proactive}
    <div class="agent-sum">✨ 小星 · 「${plan.summary}」</div>
    <div class="stage-nav">${PLAN_STAGES.map(s=>`<button class="stage-btn${s.id===activeStage?' on':''}" data-s="${s.id}">${s.emoji} ${s.label}</button>`).join('')}</div>
    <div class="stage-desc">${stageDesc(stage)}</div>
    <div class="plan-body" id="planBody"></div>
  </div>`;
  $('#phPills').querySelectorAll('.spill').forEach(p=>p.onclick=()=>setStatus(w,p.dataset.s));
  $('#phDetail').onclick=()=>{ state.activeConcert=c; switchView('detail'); };
  $('#phPoi').onclick=()=>openVenueDrawer(c);
  $('#phAgent').onclick=()=>openAgentDrawer(c);
  if(rain){
    const pYes=$('#prYes'), pNo=$('#prNo');

function renderPlanBody(ap){
  const body=$('#planBody'); if(!body) return;
  const stage=state.planStage||'prep';
  if(stage==='dday'){ renderDday(ap); return; }
  if(stage==='return'){ renderReturn(ap); return; }
  const tasks = ap.plan.tasks.filter(t=>t.stage===stage);
  body.className='plan-body cols plan-cols';
  body.innerHTML=`<div class="card timeline" id="planTimeline"></div><aside class="card context" id="planContext"></aside>`;
  renderTimeline(ap, tasks);
  const first = tasks.find(t=>!t.done) || tasks[0];
  if(first) renderPlanContext(ap, state.planNode || first.key);
  else { const ctx=$('#planContext'); if(ctx) ctx.appendChild(el('div','empty-hint','这一阶段还没有任务')); }
}
function renderTimeline(ap, tasks){
  const box=$('#planTimeline'); if(!box) return;
  box.innerHTML='';
  if(!tasks.length){ box.appendChild(el('div','empty-hint','这一阶段还没有任务')); return; }
  tasks.forEach((t,i)=>{
    const node=el('div','tl-node'+(t.done?' done':'')+(state.planNode===t.key?' on':''));
    node.appendChild(el('div','tl-rail',`<div class="tl-dot">${t.done?'✓':'●'}</div>${i<tasks.length-1?'<div class="tl-line"></div>':''}`));
    const body=el('div','tl-body');
    const when = t.done ? '<span class="tl-when" style="background:#e7f7f1;color:var(--mint)">✓ 已完成</span>' : `<span class="tl-when">${t.when}</span>`;
    body.appendChild(el('div','tl-row',`${when}<span class="tl-title">${t.emoji} ${t.title}</span>`));
    body.appendChild(el('div','tl-desc',t.desc));
    node.appendChild(body);
    node.onclick=()=>{ state.planNode=t.key; renderPlanContext(ap, t.key); box.querySelectorAll('.tl-node').forEach((n,k)=>n.classList.toggle('on', tasks[k].key===t.key)); };
    box.appendChild(node);
  });
}
function renderPlanContext(ap, key){

function renderJourney(ap){
  const box=$('#journeyBox'); if(!box) return;
  box.innerHTML='';

  steps.forEach((s,i)=>{
    const isPoi = ap.plan.pois && ap.plan.pois.includes(s.poi);
    const row=el('div','j-step'+(state.journeySel===s.poi?' on':''));
    row.appendChild(el('div','j-time',s.t));
    row.appendChild(el('div','j-main',`<span class="j-emoji">${s.emoji}</span><span class="j-title">${s.title}</span>${s.sub?`<div class="j-sub">${s.sub}</div>`:''}`));
    if(isPoi){
      const x=el('button','trip-x','✕'); x.title='移除'; x.style.cssText='margin-left:auto;align-self:center;';
      x.onclick=e=>{ e.stopPropagation(); removePoiFromPlan(s.poi); };
      row.appendChild(x);
    } else if(i<steps.length-1){
      row.appendChild(el('div','j-down','↓'));
    }

    box.appendChild(row);

function msgEl(log){
  if(log.who==='user'){
    const d=el('div','msg user',`<div class="ava">🙋‍♀️</div><div class="bubble"></div>`);
    d.querySelector('.bubble').textContent=log.html;
    return d;
  }
  return el('div','msg bot',`<div class="ava">${log.ava}</div><div class="bubble">${log.html}</div>`);
}
function pushBot(html){
  const p=currentPersona();
  chatLog.push({who:'bot', ava:p.emoji, html});
  const m=$('#msgs'); if(m){ m.appendChild(msgEl(chatLog[chatLog.length-1])); scrollChat(); }
}
function pushUser(txt){
  chatLog.push({who:'user', html:txt});
  const m=$('#msgs'); if(m){ m.appendChild(msgEl(chatLog[chatLog.length-1])); scrollChat(); }
}
let chatUI = { chips: null, action: null, actions: null };
function renderTail(){
  const cb=$('#chips'), ab=$('#actionBar');
  if(cb) cb.innerHTML='';
  if(ab) ab.innerHTML='';
  if(chatUI.chips && cb){
    chatUI.chips.forEach((o,i)=>{
      const ch=el('button','chip',o.label); ch.style.animationDelay=(i*0.06)+'s';
      ch.onclick=()=>o.cb(o.label);
      cb.appendChild(ch);
    });
  }
  if(chatUI.actions && ab){
    const row=el('div','action-row');
    chatUI.actions.forEach(a=>{
      const b=el('button', a.primary?'btn-big':'btn-big ghost', a.label); b.onclick=a.cb; row.appendChild(b);
    });
    ab.appendChild(row);
  } else if(chatUI.action && ab){
    const b=el('button','btn-big',chatUI.action.label); b.onclick=chatUI.action.cb;
    ab.appendChild(b);
  }
}
const QUICK_OPTS = ['看看推荐','帮我选个座','查查酒店','问问安检','和小星一起调整'];
function defaultChips(){ return QUICK_OPTS.map(o=>({label:o, cb:onChatChip})); }
function showChips(opts, cb){ chatUI.chips = opts.map(o=>({label:o, cb})); chatUI.action=null; chatUI.actions=null; renderTail(); }
function showAction(label, cb){ chatUI.chips = defaultChips(); chatUI.action={label, cb}; chatUI.actions=null; renderTail(); }
function showActions(actions){ chatUI.chips = defaultChips(); chatUI.action=null; chatUI.actions=actions; renderTail(); }
function showActionPlusChips(actionLabel, actionCb, chipOpts, chipCb){
  chatUI.action = {label:actionLabel, cb:actionCb};
  chatUI.chips = chipOpts.map(o=>({label:o, cb:chipCb})).concat(defaultChips());
  chatUI.actions = null;
  renderTail();
}
let recIndex = 0;
function nextConcert(){
  const cur = state.activeConcert;
  const others = CONCERTS.filter(c=>!cur || c.id!==cur.id);
  const c = others[recIndex % others.length];
  recIndex++;
  return c || CONCERTS[0];
}

function bindInput(){
  const inp=$('#chatInput'), b=$('#sendBtn');
  if(!inp || !b) return;
  const send=()=>{ const t=inp.value.trim(); if(!t) return; inp.value=''; sendMsg(t); };
  b.onclick=send;
  inp.onkeydown=e=>{ if(e.key==='Enter') send(); };
}
function sendMsg(t){ pushUser(t); reply(t); }

function ack(html){ closeOverlay(); pushBot(html); showChatChips(); }
function applyGotTicket(tierName){
  const ap=activePlan(); if(!ap) return;
  ap.w.status='ticketed';
  ap.w.tier = tierName || ap.plan.rec.best.name;
  const t=ap.plan.tasks.find(t=>t.key==='ticket'); if(t) t.done=true;
  saveState(); closeOverlay(); switchView('plan');
  toast('🎫 已经有票啦！抢票任务我帮你收起来了，之前安排好的住宿、交通和行程都还在。');
}
function applyNoHotel(){
  const ap=activePlan(); if(!ap) return;
  ap.plan.noHotel=true; ap.plan.hotel=null;
  const t=ap.plan.tasks.find(t=>t.key==='hotel'); if(t) t.done=true;
  rebuildHotelJourney(ap);
  saveState(); closeOverlay(); switchView('plan');
  toast('✅ 已改为当天往返');
}
function applyDinner(){
  const ap=activePlan(); if(!ap) return;
  const poi=VENUE_POIS.find(p=>p.id==='hotpot');
  if(poi){ if(!ap.plan.pois) ap.plan.pois=[]; if(!ap.plan.pois.includes(poi.id)){ ap.plan.pois.push(poi.id); insertPoiIntoJourney(ap.plan, poi); } }
  saveState(); closeOverlay(); switchView('plan');
  toast('🍲 火锅已加入计划，返程时间同步延后');
}
function applyLateDeparture(){
  const ap=activePlan(); if(!ap) return;
  ap.plan.journey = ap.plan.journey.map((s,i)=> i===0 ? Object.assign({},s,{t:'16:20',sub:(ap.plan.hotel?'步行 4 min 到地铁站（已延后）':'已延后出发')}) : s);
  saveState(); closeOverlay(); switchView('plan');
  toast('✅ 计划已更新：出发时间延后到 16:20');
}
function applyDepartEarly(){
  const ap=activePlan(); if(!ap) return;
  ap.plan.journey = ap.plan.journey.map((s,i)=> i===0 ? Object.assign({},s,{t:'15:25', sub:(ap.plan.hotel?'步行 4 min 到地铁站（已提前）':'提前出发')}) : s);
  saveState(); if(state.view==='plan') renderPlan(); else renderMain();
  toast('✅ 出发时间提前了 15 分钟');
}
function applyChangeHotel(){
  const ap=activePlan(); if(!ap) return;
  const nh = HOTELS.find(h=>h.id==='h2');
  ap.plan.hotel = Object.assign({}, nh, { source:'ai' }); ap.plan.noHotel=false;
  const t=ap.plan.tasks.find(t=>t.key==='hotel'); if(t) t.done=true;
  rebuildHotelJourney(ap);
  saveState(); closeOverlay(); switchView('plan');
  toast('✅ 酒店已更换为 '+nh.name);
}
function applyHotelDone(){
  const ap=activePlan(); if(!ap) return;

  saveState(); closeOverlay(); switchView('plan');

}
function applyTransport(){
  const ap=activePlan(); if(!ap) return;
  const rec=transportRecs(ap.c).find(t=>/高铁/.test(t.mode)) || transportRecs(ap.c)[0];
  if(!rec){ closeOverlay(); switchView('plan'); return; }
  ap.plan.transport = Object.assign({}, rec, { source:'ai', note:'当天往返' });
  const t=ap.plan.tasks.find(t=>t.key==='transport'); if(t) t.done=true;
  saveState(); closeOverlay(); switchView('plan');
  toast('✅ 已按当天高铁往返安排');
}
function planIntent(t){
  const ap=activePlan();
  if(!ap) return null;
  if(/(抢到|买到|已经有票|有票|出票|880|票了)/.test(t)){
    return { html:'收到～ 我把状态更新为「已经有票」，抢票任务收起来，之前安排好的住宿、交通、天气、Checklist 和当天路线都还在。', actions:[{label:'确认更新',cb:()=>applyGotTicket(),primary:true},{label:'先不改',cb:()=>ack('好，先保持原状态。')}] };
  }
  if(/(不住酒店|不住宿|当天回|当天往返|不想住|这次不用住)/.test(t)){
    return { html:'好，改为当天往返：住宿任务标为完成、出发路线改成从家出发、散场后直接返程。', actions:[{label:'应用新计划',cb:applyNoHotel,primary:true},{label:'保持原计划',cb:()=>ack('好，住宿方案先保留。')}] };
  }
  if(/(换个|换一家|换.*酒店|酒店.*换|便宜.*酒店|更便宜)/.test(t)){
    const old=(ap.plan.hotel&&ap.plan.hotel.name)||'星海精选酒店';
    const nh=HOTELS.find(h=>h.id==='h2');
    return { html:`✨ 我可以这样帮你调整：<br>住宿：<b>${old}</b> → <b>${nh.name}</b><br>预计省 <b>¥240</b>，但去场馆会多 <b>6 min</b>。`, actions:[{label:'就这样调整',cb:applyChangeHotel,primary:true},{label:'先不改',cb:()=>ack('好，先不换。')}] };
  }
  if(/(订好.*酒店|订了.*酒店|已经订.*酒店|酒店.*订好|订了酒店)/.test(t)){
    return { html:'好嘞～ 住宿我帮你标为已完成。如果想记录是哪家，可以去「行前准备 → 住宿」里添加。', actions:[{label:'标记完成',cb:applyHotelDone,primary:true},{label:'先不用',cb:()=>ack('好。')}] };
  }
  if(/(坐高铁|高铁回去|高铁.*回|坐火车|火车|坐飞机|飞机回去|飞机.*回|自驾)/.test(t)){
    const rec=transportRecs(ap.c).find(x=>/高铁/.test(x.mode))||transportRecs(ap.c)[0];
    if(!rec) return null;
    return { html:`收到～ 我帮你把城际交通定为：<b>${rec.mode} ${rec.code||''}</b>（${rec.from} → ${rec.to} · ${rec.departTime} 出发）。`, actions:[{label:'确认加入计划',cb:applyTransport,primary:true},{label:'先不改',cb:()=>ack('好。')}] };
  }
  if(/(火锅|夜宵|演出结束.*吃|想吃|吃啥|晚饭|餐厅|吃个)/.test(t)){
    return { html:'找到两家营业较晚、在返程路线附近的餐厅：<br>① 川味火锅 · 距返程站 300m · 营业至 02:00<br>② 烧烤小馆 · 步行 8 min · 营业至 01:30', actions:[{label:'＋ 加入火锅',cb:applyDinner,primary:true},{label:'先不加',cb:()=>ack('好，先不加餐。')}] };
  }
  if(/(晚点|太早|早点|不想.*早|下午三点|15:3|三点|晚出发)/.test(t)){
    return { html:'可以。如果取消周边排队，你最晚 <b>16:20</b> 从酒店出发，预计 <b>18:05</b> 到达安检口，仍保留约 55 分钟缓冲。', actions:[{label:'更新计划',cb:applyLateDeparture,primary:true},{label:'保持原计划',cb:()=>ack('好，出发时间保持不变。')}] };
  }
  if(/(下雨|天气|降温|带伞|冷)/.test(t)){
    const wx=ap.plan.weather;
    return { html:`演出当天 ${wx.temp} · ${wx.cond}，降雨概率 ${wx.rain}%，晚间体感 ${wx.night}。我已经帮你：${wx.adjustments.map(a=>a.txt).join('、')}。`, actions:[{label:'去计划页看 →',cb:()=>switchView('plan'),primary:true}] };
  }
  return null;
}
function reply(t){
  const pi=planIntent(t);
  if(pi){ pushBot(pi.html); showActions(pi.actions); return; }
  const hit=CONCERTS.find(c=>t.includes(c.artist));
  if(hit){
    state.activeConcert=hit;
    pushBot(`找到啦～ ${hit.artist} 在 ${hit.city} 的 ${hit.venue}（${hit.date}）👇 要不要去挑个座位？`);
    showAction('去选座 →', ()=>switchView('detail'));
    return;
  }
  if(/(选座|座位|位置|坐哪)/.test(t)){ pushBot('好呀，走，我帮你挑个最合适的座位 👇'); showAction('去选座 →', ()=>switchView('detail')); return; }
  if(/(酒店|住宿|住哪|订房)/.test(t)){ askHotelPath(); return; }
  if(/(安检|能带|带什么|不能带)/.test(t)){ pushBot('安检这里有几样东西要注意 👇 大型灯牌和自拍杆别带哦。'); showAction('去详情看 →', ()=>openDetail('host','security')); return; }
  if(/(应援|飘带|灯牌|手幅)/.test(t)){ pushBot('应援这块有讲究 👇 颜色按官方应援色、尺寸别挡后排、散场带走。'); showAction('去详情看 →', ()=>openDetail('host','ribbon')); return; }
  if(/(计划|规划|行程|我的计划)/.test(t)){ const ap=activePlan(); if(ap){ pushBot('这是你的观演计划 👇'); showAction('打开计划 →', ()=>switchView('plan')); return; } }
  if(/(推荐|想看|有什么|看看)/.test(t)){ pushBot('这就把适合你的演出排出来 👇'); showActionPlusChips('打开推荐 →', ()=>switchView('home'), ['还有其他想看的吗'], onChatChip); return; }
  pushBot('收到啦～ 我可以帮你：找演出、选座位、查酒店、看安检、生成并调整观演计划。你想先来哪个？✨');
  showChatChips();
}

/* ================= 复制 ================= */
function copyText(txt, btn){
  const done=()=>{ btn.textContent='已复制 ✓'; btn.style.background='var(--mint)'; setTimeout(()=>{ btn.textContent='复制'; btn.style.background=''; },1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done)); }
  else fallback(txt,done);
}
function fallback(txt, done){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); done();
}

    <div class="guide-steps">
      <div class="gs"><span class="gn">1</span><span>点顶部「<b>🏠 我的主页</b>」→ 看为你推荐的演出</span></div>
      <div class="gs"><span class="gn">2</span><span>点任意一张演出卡 → 试试「<b>💺 选座建议</b>」</span></div>
      <div class="gs"><span class="gn">3</span><span>点「<b>继续计划 →</b>」→ 看四阶段观演计划</span></div>
      <div class="gs"><span class="gn">4</span><span>回「<b>💬 AI</b>」→ 打字「换个便宜酒店」看它改计划</span></div>
    </div>
    <div class="modal-cta"><button class="btn-big" id="guideGo">开始体验 ✨</button></div>`;
  m.appendChild(box); document.body.appendChild(m);
  const done=()=>{ closeOverlay(); try{ localStorage.setItem('starshows_guide','1'); }catch(e){} };
  box.querySelector('#guideGo').onclick=done;
  m.onclick=e=>{ if(e.target===m) done(); };
}

/* ================= 启动 ================= */
(function init(){
  const had = loadState();
  if(!had){ seedState(); }
  if(profile) state.prefLabel = profile.pref;
  state.view = profileDone() ? 'chat' : 'home';
  renderTabs();
  renderMain();
  const rb=$('#resetBtn'); if(rb) rb.onclick=openResetModal;
  const gb=$('#guideBtn'); if(gb) gb.onclick=showGuide;
  let seen=false; try{ seen=localStorage.getItem('starshows_guide')==='1'; }catch(e){}
  if(!seen) showGuide();
})();
</script>
</body>
</html>
